<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f5f7f5" />
        <title>FocusDesk — Project Launcher</title>
        <style>
            :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f7f5; color: #243330; }
            * { box-sizing: border-box; }
            body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; background: #f5f7f5; }
            main { width: min(100%, 680px); padding: clamp(2rem, 6vw, 4rem); border: 1px solid #e5ebe7; border-radius: 24px; background: #fff; box-shadow: 0 30px 100px #24333012; }
            .mark { color: #27675d; font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
            h1 { margin: 1rem 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; letter-spacing: -.05em; }
            h1 span { color: #27675d; }
            p { color: #65746f; line-height: 1.7; }
            a { display: inline-flex; margin-top: 1rem; padding: .8rem 1.1rem; border-radius: 10px; background: #27675d; color: white; font-weight: 700; text-decoration: none; }
            a:focus-visible { outline: 3px solid #719f8d; outline-offset: 3px; }
            code { color: #20534c; }
            small { display: block; margin-top: 2rem; color: #65746f; }
        </style>
    </head>
    <body>
        <main>
            <div class="mark">CHARUSAT · ITUE301</div>
            <h1>FocusDesk</h1>
            <p>The React application lives in the <code>frontend/</code> workspace. Start it with <code>npm run dev:frontend</code>, then open the local Vite address.</p>
            <a href="http://localhost:5173/">Open FocusDesk</a>
            <small>A focused workspace for everyday work · AWDF project</small>
        </main>
    </body>
</html>
